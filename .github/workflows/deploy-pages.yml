name: Publish Pega Pop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Adapt absolute links for this GitHub Pages project
        run: |
          cp -R dist github-pages-site
          find github-pages-site -type f -name '*.html' -exec sed -i \
            -e 's|href="/"|href="/pattogatott-kukorica/"|g' \
            -e 's|href="/|href="/pattogatott-kukorica/|g' \
            -e 's|src="/|src="/pattogatott-kukorica/|g' {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
